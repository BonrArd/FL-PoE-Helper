name: Gerar PConc Helper.exe

# Roda quando uma versão (release) é publicada, ou manualmente na aba Actions.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar PyInstaller e Pillow
        run: pip install pyinstaller pillow

      - name: Gerar o .exe
        run: pyinstaller --noconfirm --onefile --windowed --name "PConc-Helper" --icon src/pconc_helper.ico --collect-submodules PIL src/pconc_helper.pyw

      - name: Guardar o .exe (aba Actions)
        uses: actions/upload-artifact@v4
        with:
          name: PConc-Helper
          path: dist/PConc-Helper.exe

      - name: Anexar o .exe na versão
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PConc-Helper.exe
